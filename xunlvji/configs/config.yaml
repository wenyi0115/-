# 寻旅记后端配置
app:
  name: "xunlvji"
  version: "v2.1.7"
  mode: "debug"  # debug / release / test
  port: 8080

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "xunlvji_dev"
  database: "xunlvji"
  charset: "utf8mb4"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600  # 秒

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "xunlvji-secret-key-change-in-production"
  access_ttl: 7200       # Access Token 2小时（秒）
  refresh_ttl: 2592000   # Refresh Token 30天（秒）
  issuer: "xunlvji"

# 火山引擎（豆包AI / 内容安全 / TOS存储 / CDN）
volcengine:
  access_key: ""
  secret_key: ""
  region: "cn-beijing"
  # 豆包大模型
  doubao_pro_endpoint: ""   # 豆包Pro（复杂任务：行程排序/AI对话/攻略生成）
  doubao_lite_endpoint: ""  # 豆包Lite（简单任务：意图识别/分类/标签）
  # 内容安全
  content_safety_endpoint: ""
  # 对象存储 TOS
  tos_bucket: ""
  tos_endpoint: ""
  # CDN
  cdn_domain: ""

# 阿里云（降级备选）
aliyun:
  access_key: ""
  secret_key: ""
  # 通义千问（AI降级）
  qwen_endpoint: ""
  # 内容安全降级
  content_safety_endpoint: ""
  # OSS（存储降级）
  oss_bucket: ""
  oss_endpoint: ""
  # CDN降级
  cdn_domain: ""

# 高德SDK（地图/定位/POI/导航）- 免费
amap:
  key: ""

# CPS分销（P0: 饿了么+高德打车; P1: 携程+美团）
cps:
  eleme:
    app_key: ""
    app_secret: ""
    enabled: false
  amap_ride:
    enabled: false  # 高德打车CPS，拼URL跳转无需API
  ctrip:
    app_key: ""
    app_secret: ""
    enabled: false  # P1，需企业资质
  meituan:
    app_key: ""
    app_secret: ""
    enabled: false  # P1，需企业资质

# 短信服务
sms:
  provider: "aliyun"  # aliyun / tencent
  access_key: ""
  secret_key: ""
  sign_name: "寻旅记"
  template_code: ""

# 推送服务
push:
  # iOS APNs（原生，免费）
  apns_key: ""
  apns_key_id: ""
  apns_team_id: ""
  # Android FCM（海外）
  fcm_key: ""
  # 极光推送JPush（国内Android厂商通道聚合）
  jpush_app_key: ""
  jpush_master_secret: ""

# 微信小程序
wechat:
  app_id: ""
  app_secret: ""

log:
  level: "debug"  # debug / info / warn / error
  format: "json"  # json / text
  output: "stdout"  # stdout / file
  file_path: "./logs/xunlvji.log"
